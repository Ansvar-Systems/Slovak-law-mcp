# =============================================================================
# MCP GHCR Build — Build Docker image and push to GitHub Container Registry
# =============================================================================
#
# Triggered on push to main or dev, and on manual dispatch.
# - main: pushes :latest and :sha-XXXXXXX tags
# - dev:  pushes :dev and :sha-XXXXXXX tags
#
# Watchtower on the Hetzner prod server polls GHCR every 6 hours and
# automatically restarts containers when a new :latest image is detected.
# No manual deploy step needed.
#
# DATABASE PROVISIONING (order matters — provenance over convenience):
# 1. If the checkout already carries a valid .db (LFS), use it.
# 2. Otherwise BUILD data/database.db FROM THE COMMITTED SEEDS (npm run
#    build:db). The seeds at HEAD are the source of truth; packing a stale
#    release asset instead would silently ship a pre-repair corpus (found in
#    the PR #50 adversarial review: every image build re-packed the
#    2026-03-06 v1.0.1 release DB regardless of what seeds were merged).
# 3. Release-asset download (database.db.gz from the latest GitHub Release)
#    is an EXPLICIT FALLBACK used only when data/seed/ is absent.
#
# PREREQUISITES:
# 1. Repository must have a Dockerfile at the root (or specify path)
# 2. GITHUB_TOKEN has automatic write:packages permission (no secrets needed)
# 3. For repos without committed seeds: a GitHub Release with database.db.gz
#
# =============================================================================

name: Build and Push to GHCR

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: slovak-law-mcp

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Provision database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if Dockerfile copies any .db file
          DB_FILES=$(grep -oP 'COPY\s+\K(data/\S+\.db)' Dockerfile 2>/dev/null || true)
          if [ -z "$DB_FILES" ]; then
            echo "No .db files in Dockerfile COPY, skipping"
            exit 0
          fi

          for DB_FILE in $DB_FILES; do
            if [ -f "$DB_FILE" ] && [ "$(wc -c < "$DB_FILE")" -gt 1024 ]; then
              echo "OK: $DB_FILE is valid ($(du -sh "$DB_FILE" | cut -f1))"
              continue
            fi

            # Detect LFS pointer or empty file
            if [ -f "$DB_FILE" ]; then
              if head -1 "$DB_FILE" 2>/dev/null | grep -q 'version https://git-lfs'; then
                echo "WARN: $DB_FILE is an LFS pointer, not actual data"
              else
                echo "WARN: $DB_FILE exists but is empty or too small ($(wc -c < "$DB_FILE") bytes)"
              fi
            else
              echo "WARN: $DB_FILE does not exist"
            fi

            # Preferred path: build from the committed seeds at HEAD.
            # The seeds ARE the corpus; a release asset is a frozen snapshot
            # that goes stale the moment a seed-changing PR merges.
            if compgen -G "data/seed/*.json" > /dev/null; then
              echo "Building $DB_FILE from committed seeds (data/seed/)..."
              npm ci --no-audit --no-fund
              npm run build:db
              if [ -f "$DB_FILE" ] && [ "$(wc -c < "$DB_FILE")" -gt 1024 ]; then
                echo "OK: Built $DB_FILE from seeds ($(du -sh "$DB_FILE" | cut -f1))"
                continue
              fi
              echo "ERROR: npm run build:db did not produce a valid $DB_FILE"
              exit 1
            fi

            # Explicit fallback (no committed seeds): download from GitHub Releases
            echo "No committed seeds found — falling back to the latest release asset"
            TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null) || true
            if [ -z "$TAG" ]; then
              echo "ERROR: $DB_FILE invalid, no seeds to build from, and no GitHub Release available"
              exit 1
            fi

            echo "Downloading database.db.gz from release $TAG..."
            mkdir -p data
            if gh release download "$TAG" -p "database.db.gz" -D data/ 2>/dev/null; then
              gunzip -f data/database.db.gz
              echo "OK: Downloaded $(du -sh data/database.db | cut -f1) from release $TAG"
            else
              echo "ERROR: Could not download database.db.gz from release $TAG"
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/ansvar-systems/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "## GHCR Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ env.REGISTRY }}/ansvar-systems/${{ env.IMAGE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags | $(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ', ') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
